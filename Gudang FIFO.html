<script>
/*LOGIC_START*/
const MON=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const MON3=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const ROM=['','I','II','III','IV'];
function pad(n,l){return String(n).padStart(l||2,'0')}
function localISO(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addDays(iso,d){const t=new Date(iso+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+d);return t.toISOString().slice(0,10)}
function diffDays(a,b){return Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/86400000)}
function costKg(m){return Math.round((m.qty*m.harga+(m.biaya||0))/m.qty)}
function cmpN(a,b){return a.tgl<b.tgl?-1:a.tgl>b.tgl?1:a.n-b.n}
function quarterRange(y,q){const sm=(q-1)*3+1;return{start:y+'-'+pad(sm)+'-01',end:new Date(Date.UTC(y,q*3,0)).toISOString().slice(0,10)}}
function quarterOf(iso){return{y:+iso.slice(0,4),q:Math.floor((+iso.slice(5,7)-1)/3)+1}}

/* FIFO replay: every outgoing line takes from the oldest batch (received on or before its date) that still has stock. */
function compute(st){
  const rem={},byItem={};
  st.masuk.forEach(m=>{rem[m.id]=m.qty;(byItem[m.itemId]=byItem[m.itemId]||[]).push(m)});
  Object.keys(byItem).forEach(k=>byItem[k].sort(cmpN));
  const allocs=[],errors=[];
  st.keluar.slice().sort(cmpN).forEach(k=>{
    let need=k.qty;const list=byItem[k.itemId]||[];
    for(const b of list){
      if(need<=0||b.tgl>k.tgl)break;
      if(rem[b.id]<=0)continue;
      const take=Math.min(rem[b.id],need);
      rem[b.id]-=take;need-=take;
      allocs.push({keluarId:k.id,masukId:b.id,tgl:k.tgl,itemId:k.itemId,qty:take,cost:costKg(b)});
    }
    if(need>0)errors.push({keluarId:k.id,short:need});
  });
  return{allocs,rem,errors};
}
function stockAt(st,comp,iso){
  const out={},taken={};
  comp.allocs.forEach(a=>{if(a.tgl<=iso)taken[a.masukId]=(taken[a.masukId]||0)+a.qty});
  st.masuk.forEach(m=>{
    if(m.tgl<=iso){
      const q=m.qty-(taken[m.id]||0),o=out[m.itemId]||(out[m.itemId]={qty:0,val:0});
      o.qty+=q;o.val+=q*costKg(m);
    }
  });
  return out;
}
function report(st,comp,y,q){
  const{start,end}=quarterRange(y,q);
  const awal=stockAt(st,comp,addDays(start,-1)),akhir=stockAt(st,comp,end);
  const rows={};
  const row=id=>rows[id]||(rows[id]={itemId:id,awalQty:0,awalVal:0,masukQty:0,masukVal:0,keluarQty:0,hpp:0,jual:0,akhirQty:0,akhirVal:0});
  Object.keys(awal).forEach(id=>{const r=row(id);r.awalQty=awal[id].qty;r.awalVal=awal[id].val});
  Object.keys(akhir).forEach(id=>{const r=row(id);r.akhirQty=akhir[id].qty;r.akhirVal=akhir[id].val});
  const months=[0,1,2].map(i=>({idx:i,masukQty:0,keluarQty:0,jual:0,hpp:0}));
  const mi=iso=>+iso.slice(5,7)-(q-1)*3-1;
  const inR=iso=>iso>=start&&iso<=end;
  st.masuk.forEach(m=>{if(inR(m.tgl)){const r=row(m.itemId);r.masukQty+=m.qty;r.masukVal+=m.qty*costKg(m);months[mi(m.tgl)].masukQty+=m.qty}});
  comp.allocs.forEach(a=>{if(inR(a.tgl)){const r=row(a.itemId);r.keluarQty+=a.qty;r.hpp+=a.qty*a.cost;const mo=months[mi(a.tgl)];mo.keluarQty+=a.qty;mo.hpp+=a.qty*a.cost}});
  const cust={};
  st.keluar.forEach(k=>{if(inR(k.tgl)){const v=k.qty*k.hargaJual;row(k.itemId).jual+=v;months[mi(k.tgl)].jual+=v;const c=cust[k.pelanggan]||(cust[k.pelanggan]={nama:k.pelanggan,qty:0,jual:0});c.qty+=k.qty;c.jual+=v}});
  const tot={awalQty:0,awalVal:0,masukQty:0,masukVal:0,keluarQty:0,hpp:0,jual:0,akhirQty:0,akhirVal:0};
  Object.values(rows).forEach(r=>Object.keys(tot).forEach(k=>tot[k]+=r[k]));
  return{start,end,rows:Object.values(rows),months,tot,customers:Object.values(cust).sort((a,b)=>b.jual-a.jual)};
}

/* Example data, generated relative to the given date so ages and quarters always look current. */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function seedData(today){
  const rnd=mulberry32(20261016),R=(a,b)=>a+(b-a)*rnd();
  const suppliers=[
    {id:'s1',nama:'Pacific Orchard Exports Ltd',negara:'Selandia Baru',kontak:'sales@pacificorchard.example'},
    {id:'s2',nama:'Shandong Fresh Trading Co.',negara:'Tiongkok',kontak:'+86 535 555 0142'},
    {id:'s3',nama:'Andes Frutas S.A.',negara:'Chile',kontak:'ventas@andesfrutas.example'},
    {id:'s4',nama:'Southern Harvest Pty Ltd',negara:'Australia',kontak:'+61 3 5550 0187'},
    {id:'s5',nama:'Rio Plata Frutas S.R.L.',negara:'Argentina',kontak:'+54 11 5550 0123'}
  ];
  const P=[
    {id:'i1',kode:'APL-FJ',nama:'Apel Fuji',asal:'Tiongkok',umurSimpan:60,beli:21000,D:450,sup:'s2'},
    {id:'i2',kode:'JRK-MD',nama:'Jeruk Mandarin',asal:'Tiongkok',umurSimpan:35,beli:12500,D:380,sup:'s2'},
    {id:'i3',kode:'AGR-MR',nama:'Anggur Merah Seedless',asal:'Chile',umurSimpan:28,beli:38000,D:220,sup:'s3'},
    {id:'i4',kode:'PIR-PK',nama:'Pir Packham',asal:'Argentina',umurSimpan:50,beli:17000,D:260,sup:'s5'},
    {id:'i5',kode:'KWI-HJ',nama:'Kiwi Hijau',asal:'Selandia Baru',umurSimpan:45,beli:31000,D:180,sup:'s1'},
    {id:'i6',kode:'JRK-NV',nama:'Jeruk Navel',asal:'Australia',umurSimpan:40,beli:18000,D:300,sup:'s4'}
  ];
  const items=P.map(p=>({id:p.id,kode:p.kode,nama:p.nama,asal:p.asal,minStok:p.D*4,umurSimpan:p.umurSimpan,hargaJual:Math.round(p.beli*1.17*1.32/500)*500}));
  const customers=['PT Segar Mart Nusantara','Toko Buah Mekar Jaya','Hotel Kencana Raya','CV Sumber Rejeki Buah','Katering Rasa Nusantara','Supermarket Bintang Pagi','Resto Taman Selera'];
  const masuk=[],keluar=[],stock={},last={},mseq={},kseq={};
  P.forEach(p=>{stock[p.id]=0;last[p.id]=-99});
  const start=addDays(today,-200);let n=0;
  for(let d=start,idx=0;d<today;d=addDays(d,1),idx++){
    const dow=new Date(d+'T00:00:00Z').getUTCDay(),ym=d.slice(2,4)+d.slice(5,7);
    P.forEach(p=>{
      if(stock[p.id]<p.D*14&&idx-last[p.id]>=9){
        const qty=Math.round(p.D*12*R(.9,1.15)/100)*100,harga=Math.round(p.beli*R(.94,1.07)/100)*100;
        const biaya=Math.round(qty*harga*R(.13,.18)/1000)*1000,key='m'+ym;
        mseq[key]=(mseq[key]||0)+1;
        masuk.push({id:'m'+(++n),n,kode:'BM-'+ym+'-'+pad(mseq[key],3),tgl:d,itemId:p.id,supplierId:p.sup,
          container:['MSKU','TGHU','CMAU','OOLU'][Math.floor(rnd()*4)]+' '+pad(Math.floor(rnd()*9999999),7),qty,harga,biaya,catatan:''});
        stock[p.id]+=qty;last[p.id]=idx;
      }
      if(dow!==0&&rnd()<.38){
        let q=Math.round(3.07*p.D*R(.5,1.5)/50)*50;q=Math.min(q,stock[p.id]);
        if(q>=50){
          const key='k'+ym;kseq[key]=(kseq[key]||0)+1;
          const hj=Math.round(items.find(i=>i.id===p.id).hargaJual*R(.97,1.05)/500)*500;
          keluar.push({id:'k'+(++n),n,no:'BK-'+ym+'-'+pad(kseq[key],4),tgl:d,itemId:p.id,pelanggan:customers[Math.floor(rnd()*customers.length)],qty:q,hargaJual:hj,catatan:''});
          stock[p.id]-=q;
        }
      }
    });
  }
  return{v:1,sample:true,seq:n+10,items,suppliers,masuk,keluar};
}
/*LOGIC_END*/

function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p;return(f<=1?1:f<=2?2:f<=5?5:10)*p}
function chartSvg(months,q){
  const W=480,H=250,L=58,Rr=10,T=22,B=34,pw=W-L-Rr,ph=H-T-B;
  const mx=niceMax(Math.max(...months.map(m=>Math.max(m.masukQty,m.keluarQty)),1));
  const y=v=>T+ph-v/mx*ph,gw=pw/3,bw=Math.min(44,gw/2-8);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Barang masuk dan keluar per bulan, dalam kg">`;
  [0,mx/2,mx].forEach(t=>{s+=`<line class="grid" x1="${L}" x2="${W-Rr}" y1="${y(t)}" y2="${y(t)}"/><text x="${L-8}" y="${y(t)+4}" text-anchor="end">${n0(t)}</text>`});
  months.forEach((m,i)=>{
    const cx=L+gw*i+gw/2,mn=MON3[(q-1)*3+i];
    [[m.masukQty,-bw-2,'bin'],[m.keluarQty,2,'bout']].forEach(([v,dx,c])=>{
      const h=v/mx*ph;
      s+=`<rect class="${c}" x="${cx+dx}" y="${y(v)}" width="${bw}" height="${Math.max(0,h)}" rx="3"/>`;
      if(v>0)s+=`<text x="${cx+dx+bw/2}" y="${y(v)-5}" text-anchor="middle" style="font-size:11px">${n0(v)}</text>`;
    });
    s+=`<text x="${cx}" y="${H-12}" text-anchor="middle">${mn}</text>`;
  });
  return s+'</svg>';
}

/* ----- commit with FIFO validation ----- */
function commit(nx){
  const c=compute(nx);
  if(c.errors.length){
    const msgs=c.errors.slice(0,3).map(e=>{const k=nx.keluar.find(x=>x.id===e.keluarId);return`${k.no} (${(nx.items.find(i=>i.id===k.itemId)||{nama:'?'}).nama}) kekurangan ${n0(e.short)} kg`});
    return{ok:false,msg:'Perubahan ditolak karena stok tidak cukup untuk barang keluar: '+msgs.join('; ')+(c.errors.length>3?' dan lainnya':'')+'.'};
  }
  nx.sample=false;S=nx;COMP=c;persist();return{ok:true};
}

function showErr(m){const e=$('merr');if(e){e.textContent=m;e.hidden=false}}
function fld(id,label,value,o){o=o||{};
  let inp;
  if(o.select)inp=`<select id="${id}">${o.select.map(([v,t])=>`<option value="${esc(v)}"${v===value?' selected':''}>${esc(t)}</option>`).join('')}</select>`;
  else if(o.area)inp=`<textarea id="${id}" rows="2">${esc(value)}</textarea>`;
  else inp=`<input id="${id}" type="${o.type||'text'}" value="${esc(value)}"${o.min!=null?` min="${o.min}"`:''}${o.step?` step="${o.step}"`:''}${o.type==='number'?' inputmode="numeric"':''}${o.ph?` placeholder="${esc(o.ph)}"`:''} autocomplete="off">`;
  return `<div class="field${o.full?' full':''}"><label for="${id}">${label}</label>${inp}${o.hint?`<div class="hint">${o.hint}</div>`:''}</div>`;
}
const foot=(label,cls)=>`<div class="mfoot"><button class="btn" type="button" data-act="close">Batal</button><button class="btn ${cls||'primary'}" type="submit">${label}</button></div>`;

function nextKode(prefix,tgl,list,key,len){
  const p=prefix+'-'+tgl.slice(2,4)+tgl.slice(5,7)+'-';let mx=0;
  list.forEach(x=>{if(x[key].startsWith(p))mx=Math.max(mx,parseInt(x[key].slice(p.length),10)||0)});
  return p+pad(mx+1,len);
}

function previewK(editId){
  const box=$('kprev');if(!box)return;
  const qty=intVal('k_qty'),tgl=v('k_tgl'),itemId=v('k_item'),hj=intVal('k_harga')||0;
  if(!(qty>=1)||!tgl){box.innerHTML='<span class="muted">Isi tanggal dan jumlah untuk melihat batch yang diambil.</span>';return}
  const nx=clone(S),old=editId?nx.keluar.find(x=>x.id===editId):null;
  nx.keluar=nx.keluar.filter(x=>x.id!==editId);
  const draft={id:'__draft',n:old?old.n:1e9,no:'',pelanggan:'',tgl,itemId,qty,hargaJual:hj};nx.keluar.push(draft);
  const c=compute(nx),mine=c.allocs.filter(a=>a.keluarId==='__draft');
  let h=mine.map(a=>`<span class="mono">${esc((nx.masuk.find(m=>m.id===a.masukId)||{kode:'?'}).kode)} · ${n0(a.qty)} kg × ${rp(a.cost)}</span>`).join('');
  const hpp=mine.reduce((s,a)=>s+a.qty*a.cost,0);
  if(mine.length)h+=`<div style="margin-top:6px">HPP ${rp(hpp)}${hj?` · penjualan ${rp(qty*hj)} · laba kotor <b>${rp(qty*hj-hpp)}</b>`:''}</div>`;
  c.errors.forEach(e=>{
    const k=e.keluarId==='__draft'?null:nx.keluar.find(x=>x.id===e.keluarId);
    h+=`<div style="margin-top:6px;color:var(--bad)">${k?`Perubahan ini membuat ${esc(k.no)} kekurangan ${n0(e.short)} kg.`:`Stok pada tanggal ini kurang ${n0(e.short)} kg.`}</div>`;
  });
  box.innerHTML=h;
}
function done(r){if(r.ok){closeModal();render()}else showErr(r.msg)}

  const extra=ent==='keluar'?'Stok yang terpakai akan kembali ke batch asalnya.':ent==='masuk'?'Batch tidak bisa dihapus kalau stoknya sudah dipakai barang keluar.':'';
  openModal('Hapus '+lab+'?',`<p>Hapus <b>${esc(name)}</b> secara permanen? ${extra}</p>${foot('Hapus','dangerfill')}`,()=>{
    const nx=clone(S);
    if(ent==='item'&&(S.masuk.some(m=>m.itemId===id)||S.keluar.some(k=>k.itemId===id)))return showErr('Item ini sudah dipakai di transaksi dan tidak bisa dihapus.');
    if(ent==='supplier'&&S.masuk.some(m=>m.supplierId===id))return showErr('Supplier ini tercatat di barang masuk dan tidak bisa dihapus.');
    const key={item:'items',supplier:'suppliers',masuk:'masuk',keluar:'keluar'}[ent];
    nx[key]=nx[key].filter(x=>x.id!==id);
    done(commit(nx));
  });
}

async function copyText(text,btn){
  let ok=false;
  try{await navigator.clipboard.writeText(text);ok=true}catch(e){}
  if(!ok){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{ok=document.execCommand('copy')}catch(e){}ta.remove()}
  if(btn){const t=btn.textContent;btn.textContent=ok?'Tersalin':'Gagal menyalin';setTimeout(()=>{btn.textContent=t},1500)}
}

/* ----- events ----- */
document.addEventListener('click',e=>{
  const ov=e.target.id==='ov'?e.target:null;if(ov){closeModal();return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,ent=b.dataset.ent,id=b.dataset.id;
  if(a==='close')closeModal();
  else if(a==='add')openForm(ent);
  else if(a==='edit')openForm(ent,id);
  else if(a==='del')askDelete(ent,id);
  else if(a==='more'){if(b.dataset.k==='M')ui.limM+=40;else ui.limK+=40;fillRows()}
  else if(a==='rq'){ui.rq=+b.dataset.q;render()}
  else if(a==='backup')openBackup();
  else if(a==='reset')askReset();
  else if(a==='copybk'){const t=$('bk');copyText(t.value,b);t.select()}
  else if(a==='copyrep')copyText(reportText(),b);
});
document.addEventListener('submit',e=>{if(e.target.id==='mf'){e.preventDefault();if(onSubmit)onSubmit()}});
document.addEventListener('change',e=>{
  const f=e.target.dataset&&e.target.dataset.f;if(!f)return;
  ui[f]=f==='ry'?+e.target.value:e.target.value;
  if(f==='fItemM')ui.limM=40;if(f==='fItemK')ui.limK=40;
  render();
});
document.addEventListener('input',e=>{
  const f=e.target.dataset&&e.target.dataset.fi;if(!f)return;
  ui[f]=e.target.value;if(f==='qM')ui.limM=40;if(f==='qK')ui.limK=40;fillRows();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('ov'))closeModal()});

syncHash();
</script>

</body></html>
